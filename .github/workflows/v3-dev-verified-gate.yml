name: V3 DEV Verified Gate
on:
  push:
    branches:
      - feature/v3-home-agent
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # No generated REVIEW-*.md per run: Actions stores the concise operational result.
      - name: Run isolated tests and write a compact GitHub summary
        shell: bash
        run: |
          set -o pipefail
          set +e
          npm test | tee "$RUNNER_TEMP/rs-v3-offline-tests.log"
          test_exit=$?
          set -e
          {
            echo '### RS Home AI V3 — DEV offline verification'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            if [ "$test_exit" -eq 0 ]; then
              echo '- Outcome: **PASS**'
            else
              echo '- Outcome: **FAIL** (see job log)'
            fi
            grep -E '^Isolated test files:' "$RUNNER_TEMP/rs-v3-offline-tests.log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$test_exit"
