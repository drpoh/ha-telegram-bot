title: Регистрация освещения
views:
  - title: Светильники
    path: lighting
    icon: mdi:lightbulb-group-outline
    cards:
      - type: markdown
        title: Мастер регистрации освещения
        content: |
          **Этап 1 — инвентаризация без управления устройствами.**

          1. Проверь имя, помещение, доступность и назначение.
          2. Сверь светильник физически (пока без автоматического мигания).
          3. Запиши подтверждённые сведения в реестр AI после проверки.

          **Внимание:** эта страница не даёт AI разрешения включать или выключать свет.
      - type: markdown
        title: Группа «Весь свет»
        entity_id: light.ves_svet
        content: |
          **Группа:** `light.ves_svet` · **Источник:** Home Assistant Group

          **Текущий состав ({{ state_attr('light.ves_svet', 'entity_id') | count if state_attr('light.ves_svet', 'entity_id') is iterable else 0 }}):**

          {% set member_ids = state_attr('light.ves_svet', 'entity_id') or [] %}
          {% for id in member_ids %}
          - `{{ id }}` — {{ state_attr(id, 'friendly_name') or id }} · **{{ states(id) }}**
          {% endfor %}

          Если состав изменился, разрешения AI нужно проверить повторно.
      - type: markdown
        title: Неопознанные или требующие уточнения
        content: |
          | ID | Ранее наблюдавшееся состояние | Проверка |
          |---|---|---|
          | `light.svet` | Недоступен | Назначение / кухня |
          | `light.sonoff_1000d78a79` | Недоступен | Коридор / принадлежность группе |
          | `light.koridor_2` | Доступен | Физическое расположение |
          | `light.koridor_1_etazh_2` | Доступен | Коридор 1 этажа |
          | `light.wled_gledopto` | Доступен | Подсветка сауны |
          | `switch.vannaia_svet` | Доступен | Освещение ванной |

          Статусы в таблице — исторические наблюдения; актуальный статус смотри ниже.
      - type: entities
        title: "Актуальные состояния (переключатели активны)"
        show_header_toggle: false
        entities:
          - entity: light.svet
            name: Кухня — уточнить
          - entity: light.sonoff_1000d78a79
            name: Sonoff — уточнить
          - entity: light.koridor_2
            name: Коридор — уточнить
          - entity: light.koridor_1_etazh_2
            name: Коридор 1 этажа — уточнить
          - entity: light.wled_gledopto
            name: Сауна — WLED
          - entity: switch.vannaia_svet
            name: Ванная — свет
      - type: markdown
        title: Будущий этап идентификации
        content: |
          **Мигание / изменение яркости / физический выключатель** появятся
          только после реализации контроллера с тайм-аутом, подтверждением
          и безопасным восстановлением исходного состояния.
          До этого этапа никакого автоматического переключения нет.

      - type: iframe
        title: Идентификация и регистрация (демо)
        url: /local/lighting-commissioning/index.html
        aspect_ratio: 85%
